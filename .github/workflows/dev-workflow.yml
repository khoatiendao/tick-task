name: Develop Github Action

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Notify Discord - Build Started
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"content\":\":rocket: Build started :rocket for PR #${{ github.event.pull_request.number }} by ${{ github.actor }}\"}" \
            ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/your-image-name:pr-${{ github.event.pull_request.number }} .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/your-image-name:pr-${{ github.event.pull_request.number }}

      - name: Notify Discord - Build Success
        if: success()
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"content\":\":white_check_mark: Build succeeded ✅ for PR #${{ github.event.pull_request.number }}\"}" \
            ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Notify Discord - Build Failed
        if: failure()
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"content\":\":x: Build failed ❌ for PR #${{ github.event.pull_request.number }}\"}" \
            ${{ secrets.DISCORD_WEBHOOK_URL }}
