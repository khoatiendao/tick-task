version: 2.1

orbs:
  node: circleci/node@5

jobs:
  test-node:
    executor: node/default
    steps:
      - checkout
      - run:
          name: Cài Node dependencies và chạy test
          command: |
            echo "🚀 Bắt đầu cài Node dependencies..."
            if ! npm install; then
              echo "❌ Cài Node dependencies thất bại."
              exit 1
            fi
            echo "🧪 Đang chạy test..."
            if ! npm test; then
              echo "❌ Test thất bại."
              exit 1
            fi

  build-node:
    executor: node/default
    steps:
      - checkout
      - run:
          name: Cài Node dependencies và build project
          command: |
            echo "🚀 Bắt đầu cài Node dependencies..."
            if ! npm install; then
              echo "❌ Cài Node dependencies thất bại trong build."
              exit 1
            fi
            echo "🔨 Đang build project..."
            if ! npm run build; then
              echo "❌ Build thất bại."
              exit 1
            fi
      - store_artifacts:
          path: build
          destination: node-build

workflows:
  build-and-test:
    jobs:
      - test-node
      - build-node:
          requires:
            - test-node
